name: App Android ScanDoc
on:
  push:
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Gerar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk ScanDoc.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: ScanDoc app ${{ github.run_number }}
          files: ScanDoc.apk
          make_latest: true
